# Lab Grader CI: the same checks as the Jenkins job, on every push and pull request.
#   unit   every unit-test suite, in the test image (`make test`)
#   stack  real sandbox isolation tests, then the whole stack in demo mode + smoke test
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile.test
          tags: autograder-test
          load: true
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test
      - name: Unit tests
        run: docker run --rm autograder-test

  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile.test
          tags: autograder-test
          load: true
          cache-from: type=gha,scope=test
      - name: Create .env (demo mode, random secrets)
        run: python3 scripts/init_env.py
      - name: Build images
        run: |
          docker compose --profile images build runner-python runner-gcc runner-java
          docker compose build sandbox mcp app
      - name: Sandbox isolation tests (real Docker)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock autograder-test \
            bash -c "cd sandbox && python -m pytest -m docker -v tests/test_isolation_docker.py"
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300 db sandbox mcp app
      - name: Smoke test
        run: make smoke
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color app sandbox mcp
      - name: Stop the stack
        if: always()
        run: docker compose down -v
