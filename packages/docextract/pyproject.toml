[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docextract"
version = "1.0.0"
description = "Extract student programs from PDF submissions and detect code similarity"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24", "pytesseract>=0.3.10", "pillow>=10.0", "pillow-heif>=0.16"]

[project.scripts]
docextract = "docextract.cli:main"

[tool.setuptools]
packages = ["docextract"]
